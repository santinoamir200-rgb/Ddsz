name: Build HaxCup APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Preparar proyecto
        run: |
          mkdir www assets
          cp "$(ls *.html | head -n1)" www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/app@7 @capacitor/cli@7
          echo '{"appId":"com.haxcup.app","appName":"HaxCup","webDir":"www","android":{"backgroundColor":"#0b1612"},"server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android

      - name: Iconos y splash
        continue-on-error: true
        run: |
          cp icon-only.png icon-foreground.png icon-background.png splash.png assets/
          cp splash.png assets/splash-dark.png
          npm install --save-dev @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor '#0b1612' --splashBackgroundColor '#0b1612'

      - name: Pantalla completa y rotacion libre
        run: |
          cd android/app/src/main
          sed -i 's|android:launchMode="singleTask"|android:launchMode="singleTask" android:screenOrientation="fullSensor"|' AndroidManifest.xml
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>|' res/values/styles.xml
          cp java/com/haxcup/app/MainActivity.java /tmp/MainActivity.orig
          cat > java/com/haxcup/app/MainActivity.java <<'EOF'
          package com.haxcup.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              hideBars();
            }
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }
            private void hideBars() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
            }
          }
          EOF

      - run: npx cap sync android
      - name: Compilar
        id: b1
        continue-on-error: true
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Compilar sin pantalla completa (plan B)
        if: steps.b1.outcome == 'failure'
        run: |
          cp /tmp/MainActivity.orig android/app/src/main/java/com/haxcup/app/MainActivity.java
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HaxCup-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
